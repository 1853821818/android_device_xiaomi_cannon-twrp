name: Build TWRP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DEVICE: cannon
  OEM: xiaomi

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python2 python3
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Initialize repo
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b android-12.1

      - name: Sync source
        run: |
          cd ~/android/twrp
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        run: |
          cd ~/android/twrp
          git clone https://github.com/${{ github.repository }}.git device/xiaomi/cannon -b main

      - name: Build
        run: |
          cd ~/android/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_cannon-eng
          mka recoveryimage -j4

      - name: Check output
        run: |
          cd ~/android/twrp
          ls -la out/target/product/cannon/
          find out/target/product/cannon -name "*.img" -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: twrp-cannon
          path: ~/android/twrp/out/target/product/cannon/recovery.img
