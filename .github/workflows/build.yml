name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install basic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core curl python3 build-essential zip unzip
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "Basic tools installed"

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV
          echo "Repo installed"

      - name: Initialize repo
        run: |
          repo version
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14
          echo "Repo initialized"

      - name: Sync source
        run: |
          cd ~/android/twrp
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          echo "Source synced"

      - name: Clone device tree
        run: |
          cd ~/android/twrp
          git clone https://github.com/1853821818/android_device_xiaomi_cannon-twrp.git device/xiaomi/cannon -b main
          echo "Device tree cloned"

      - name: Debug release config
        run: |
          cd ~/android/twrp
          echo "=== build/release directory ==="
          ls -la build/make/core/release_config.mk 2>&1 || true
          ls -la build/release/ 2>&1 || true
          echo "=== Search TARGET_RELEASE in build system ==="
          grep -r "TARGET_RELEASE" build/make/core/ 2>/dev/null | head -20 || true
          echo "=== Available release configs ==="
          grep -r "ap3a\|ap2a\|ap1a\|release" build/make/core/release_config.mk 2>/dev/null | head -20 || true
          echo "=== Try TARGET_RELEASE=ap3a ==="
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_RELEASE=ap3a
          source build/envsetup.sh
          lunch twrp_cannon-eng 2>&1 || true
          echo "=== Try lunch twrp_cannon-ap3a-eng ==="
          lunch twrp_cannon-ap3a-eng 2>&1 || true
          echo "Debug completed"

      - name: Build with TARGET_RELEASE
        run: |
          cd ~/android/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_RELEASE=ap3a
          source build/envsetup.sh
          lunch twrp_cannon-ap3a-eng
          mka recoveryimage -j4
          echo "Build completed"

      - name: Check output
        run: |
          cd ~/android/twrp
          ls -la out/target/product/cannon/ 2>&1 || true
          find out/target/product/cannon -name "*.img" -type f 2>&1 || true

      - name: Copy output
        run: |
          cd ~/android/twrp
          mkdir -p $GITHUB_WORKSPACE/output
          if [ -f out/target/product/cannon/recovery.img ]; then
            cp out/target/product/cannon/recovery.img $GITHUB_WORKSPACE/output/
            echo "recovery.img copied"
          else
            echo "recovery.img not found"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-cannon
          path: output/recovery.img
